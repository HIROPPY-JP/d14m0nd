<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>jQueryノンリロードメールフォーム サンプル 1</title>
<style type="text/css">
* {
	margin: 0px;
	padding: 0;
}

html, body {
	font-family: "ヒラギノ角ゴ Pro W3", "Hiragino Kaku Gothic Pro", "メイリオ", Meiryo, "ＭＳ Ｐゴシック", "MS PGothic", sans-serif;
	font-size: 14px;
	line-height: 1.6em;
	letter-spacing: 0;
}
input,select,textarea{
	padding:4px;
	font-size:100%;
}
button{
	padding:7px;
	font-size:100%;
}
#container{
	padding:20px;
}
h1{
	font-size: 120%;
	padding-bottom: 20px;
}
table{
	border:#dddddd solid 1px;
	border-collapse:collapse;
}
table tr th{
	border:#dddddd solid 1px;
	padding:7px;
}
table tr td{
	border:#dddddd solid 1px;
	padding:7px;
}



</style>
<link href="validationEngine.jquery.css" rel="stylesheet" type="text/css">
<script src="//ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
<script type="text/javascript" src="jquery.validationEngine.js"></script>
<script type="text/javascript" src="jquery.validationEngine-ja.js"></script>
<script type="text/javascript" src="jquery.validationEngine.nonreload.js"></script>
</head>
<body>
<script type="text/javascript">
 $(function(){
    $('#formSample1').MyMailForm({
        'button_check' : '入力内容を確認する &Gt;',
        'button_back'  : '&Lt; 訂正画面へ戻る',
        'button_send'  : 'メールを送信する &Gt;',
    });
 });
</script>

<div id="container"> 
  <h1>SAMPLE 1</h1>
  
  <form id="formSample1" name="formSample1" method="post">
    <table>
      <tr>
        <th>テキストフオーム</th>
        <td>
          <input type="text" name="name" id="name" class="validate[required] text-input">
          <input type="text" name="email" id="email" class="validate[required] text-input">
          <input type="text" name="from" id="from" class="validate[required] text-input">
          <input type="text" name="message" id="message" class="validate[required] text-input">
          <input type="text" name="subject" id="subject" class="validate[required] text-input">
        </td>
      </tr>
      <tr>
        <th>セレクトボックス</th>
        <td>
          <select name="select1" id="select1" class="validate[required]">
            <option value="AAAAA">AAAAA</option>
            <option value="BBBBB">BBBBB</option>
            <option value="CCCCC">CCCCC</option>
            <option value="DDDDD">DDDDD</option>
            <option value="EEEEE">EEEEE</option>
          </select>
        </td>
      </tr>

      <tr>
        <th>複数選択</th>
        <td>
          <select name="select2" multiple id="select2">
            <option value="AAAAA">AAAAA</option>
            <option value="BBBBB">BBBBB</option>
            <option value="CCCCC">CCCCC</option>
            <option value="DDDDD">DDDDD</option>
            <option value="EEEEE">EEEEE</option>
          </select>
        </td>
      </tr>

      <tr>
        <th>チェックボックス</th>
        <td>
          <input type="checkbox" name="check1" id="check1" value="check1"> <label for="check1"> check1 </label>
          <input type="checkbox" name="check2" id="check2" value="check2"> <label for="check2"> check2 </label>
          <input type="checkbox" name="check3" id="check3" value="check3"> <label for="check3"> check3 </label>
        </td>
      </tr>
      <tr>
        <th>ラジオボタン</th>
        <td>
          <input type="radio" name="radio" id="radio1" value="radio1"> <label for="radio1"> Radio1 </label>
          <input type="radio" name="radio" id="radio2" value="radio2"> <label for="radio2"> Radio2 </label>
          <input type="radio" name="radio" id="radio3" value="radio3"> <label for="radio3"> Radio3 </label>
        </td>
      </tr>
      <tr>
        <th>テキストエリア</th>
        <td><textarea cols="40" rows="5" id="comment" name="comment" class="validate[required]"></textarea></td>
      </tr>
    </table>
    
  </form>
</div>
</body>
</html>
